<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f2ed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.invite{
    width:min(500px, 95vw);
}

.panel-container{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    perspective:2500px;
}

/* PANELS */
.panel{
    position:absolute;
    width:100%;
    height:50%;
    left:0;
    overflow:hidden;
    transform-style:preserve-3d;
    transition:transform 1.3s cubic-bezier(.22,.61,.36,1);
}

.top-panel{
    top:0;
    transform-origin:top center;
}

.bottom-panel{
    bottom:0;
    transform-origin:bottom center;
}

.invite.open .top-panel{
    transform:rotateX(180deg);
}

.invite.open .bottom-panel{
    transform:rotateX(-180deg);
}

.face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
}

.face img{
    width:100%;
    height:200%;
    object-fit:cover;
    display:block;
}

.top-panel .front img{ object-position:top; }
.bottom-panel .front img{ object-position:bottom; }

.top-panel .back{
    transform:rotateX(180deg);
}

.bottom-panel .back{
    transform:rotateX(180deg);
}

/* CENTER CONTENT */
.center-content{
    position:absolute;
    inset:0;
    z-index:1;
}

.center-content img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* WAX SEAL */
.waxseal{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:90px;
    z-index:20;
    transition:opacity .4s ease, transform .4s ease;
}

.invite.open .waxseal{
    opacity:0;
    transform:translate(-50%, -50%) scale(0.6);
}

/* TAP */
.tap{
    position:absolute;
    inset:0;
    z-index:30;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="invite" id="invite">

    <div class="panel-container">

        <!-- TOP -->
        <div class="panel top-panel">

            <div class="face front">
                <img src="cover-front-top.jpeg">
            </div>

            <div class="face back">
                <img src="cover-back-top.jpeg">
            </div>

        </div>

        <!-- BOTTOM -->
        <div class="panel bottom-panel">

            <div class="face front">
                <img src="cover-front-bottom.jpeg">
            </div>

            <div class="face back">
                <img src="cover-back-bottom.jpeg">
            </div>

        </div>

        <!-- INSIDE -->
        <div class="center-content">
            <img src="inside.jpeg">
        </div>

        <!-- WAX SEAL -->
        <img class="waxseal" src="seal.png">

        <!-- TAP AREA -->
        <div class="tap"></div>

    </div>

</div>

<script>
document.querySelector('.tap').addEventListener('click', () => {
    document.getElementById('invite').classList.toggle('open');
});
</script>

</body>
</html>
