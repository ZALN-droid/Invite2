<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipbook</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:#000;
}

.page{
    position:absolute;
    inset:0;
    display:none;
}

.page.active{
    display:block;
}

.page img{
    width:100%;
    height:100%;
    object-fit:contain;
}
</style>
</head>
<body>

<div class="page active">
    <img src="image1.png" alt="">
</div>

<div class="page">
    <img src="image2.png" alt="">
</div>

<div class="page">
    <img src="image3.png" alt="">
</div>

<div class="page">
    <img src="image4.png" alt="">
</div>

<div class="page">
    <img src="image5.png" alt="">
</div>

<script>
const pages = document.querySelectorAll('.page');
let current = 0;

function showPage(index){
    pages.forEach(page => page.classList.remove('active'));
    pages[index].classList.add('active');
}

document.addEventListener('click', function(e){

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cornerWidth = w * 0.20;
    const cornerHeight = h * 0.20;

    const bottomRight =
        e.clientX > w - cornerWidth &&
        e.clientY > h - cornerHeight;

    const bottomLeft =
        e.clientX < cornerWidth &&
        e.clientY > h - cornerHeight;

    if(bottomRight && current < pages.length - 1){
        current++;
        showPage(current);
    }

    if(bottomLeft && current > 0){
        current--;
        showPage(current);
    }
});
</script>

</body>
</html>
